<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Тех. карта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="loading-icon">☕</div>
  <p class="loading-text">Загрузка...</p>
</div>

<div id="app" class="hidden">

  <!-- Хедер -->
  <header class="header">
    <button id="backBtn" class="icon-btn hidden" aria-label="Назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span id="headerTitle" class="header-title">Тех. карта</span>
    <button id="searchBtn" class="icon-btn" aria-label="Поиск">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </header>

  <!-- Поиск -->
  <div id="searchOverlay" class="search-overlay hidden">
    <div class="search-header">
      <button id="closeSearchBtn" class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <input id="searchInput" class="search-input" type="search" placeholder="Найти напиток...">
    </div>
    <div id="searchResults" class="search-results">
      <div class="search-hint">Введите название напитка</div>
    </div>
  </div>

  <!-- Контент -->
  <main id="main">

    <div id="categoriesView" class="view active">
      <div id="categoriesGrid" class="categories-grid"></div>
    </div>

    <div id="drinksView" class="view">
      <div id="drinksList" class="drinks-list"></div>
    </div>

    <div id="drinkView" class="view">
      <div id="drinkContent"></div>
    </div>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
